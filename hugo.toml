baseURL = 'localhost'
locale = 'en-us'
title = 'Indonesian Civilians Cyber Watch Dog Association'
theme = "hello-friend-ng"

[services]
    [services.rss]
        # Maximum number of items in the RSS feed.
        limit = 42

[taxonomies]
    tag      = "tags"
    category = "categories"
    series   = "series"

[params]
    dateform        = "Jan 2, 2006"
    dateformShort   = "Jan 2"
    dateformNum     = "2006-01-02"
    dateformNumTime = "2006-01-02 15:04"

    homeSubtitle = "The ICCWDA, by the people, for the people"

    enableReadingTime = true
    enableSharingButtons = true

    disableRSS     = false
    disableSitemap = false
    disable404     = false
    disableHugoGeneratorInject = false

    [params.logo]
        logoMark     = ">"
        logoText     = "$ cd /home/ICCWDA"
        logoHomeLink = "/"
    
    [params.footer]
        rss = true

        topText = []
        bottomText = [
            "Powered by <a href=\"http://gohugo.io\">Hugo</a>",
            "Made with &#10084; by <a href=\"https://github.com/thatITfox\">Max The Computer Fox</a>"
        ]
    
[menu]
    [[menu.main]]
        identifier = "posts"
        name       = "Posts"
        url        = "/posts/"

    [[menu.main]]
        identifier  = "about"
        name        = "About"
        url         = "/about/"